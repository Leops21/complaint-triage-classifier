[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-triage-escalation-classifier"
version = "0.1.0"
description = "Transformer-based complaint triage and escalation classifier for CFPB complaint narratives."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Leonardo" }]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
    "scipy>=1.10.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
